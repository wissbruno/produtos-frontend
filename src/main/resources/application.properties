# Porta: 8080 no seu PC; no Render usa a variavel PORT
server.port=${PORT:8080}
spring.application.name=produtos-frontend

# Configuracao para servir arquivos estaticos
spring.web.resources.static-locations=classpath:/static/
spring.mvc.static-path-pattern=/**

# Desabilitar funcionalidades nao necessarias
spring.thymeleaf.enabled=false

# Configuracoes para producao
spring.web.resources.cache.cachecontrol.max-age=3600
spring.web.resources.cache.cachecontrol.must-revalidate=true
